name: Release

# Once a week, releases the next patch version when every commit since the
# latest vX.Y.Z tag, merge commits aside, is Renovate's and they changed
# something outside .github/ and renovate.json. .github/release/plan.rb decides
# it and logs why; otherwise the run ends without a release, and the release is
# left to a tag pushed by hand. `ruby .github/release/plan.rb` asks the same
# question in a checkout.
#
# A tag pushed with the run's token starts no workflow, so image.yaml would
# never see this one. The image is pushed by calling image.yaml first, from the
# commit about to be tagged, and the tag only follows once that succeeded: a
# failed build leaves no tag pointing at an image that does not exist. A tag
# pushed by hand still releases through image.yaml as before.
on:
  schedule:
    - cron: "0 0 * * 1" # Monday 09:00 JST
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    # A dispatch can name any branch, but a release is cut from master only.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      message: ${{ steps.plan.outputs.message }}
    steps:
      # Every tag and the history back to the latest one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - id: plan
        run: ruby .github/release/plan.rb

  image:
    needs: plan
    if: needs.plan.outputs.version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yaml
    with:
      version: ${{ needs.plan.outputs.version }}

  tag:
    needs: [plan, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # An annotated tag, so that it says which updates it released, on the
      # commit the image was built from: github.sha is the same in every job of
      # this run.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          MESSAGE: ${{ needs.plan.outputs.message }}
        run: |
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$VERSION" -f message="$MESSAGE" \
            -f object="$GITHUB_SHA" -f type=commit \
            -f 'tagger[name]=github-actions[bot]' \
            -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$object"
