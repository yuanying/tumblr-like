name: Image

# Every run builds the image and runs the smoke test in it. A tag publishes a
# release: v0.4.0 is pushed as 0.4.0, 0.4 and latest. A push to master publishes
# main, so a vulnerability scanner can tell a fix that is on master from one that
# has been released. The tag is main even though the branch is master: every
# repository publishes its default branch under the same name.
#
# release.yaml calls this with the version it is about to tag. A tag pushed with
# the run's token starts no workflow, so the release is pushed here first, from
# the commit about to be tagged, under the same names a tag pushed by hand gets.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: The version tag release.yaml is about to push (vX.Y.Z).
        type: string
        required: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The image runs as a CronJob on the workers of fraction, which are all amd64.
  # The arm64 machines there are control planes and take no workloads.
  PLATFORMS: linux/amd64
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || inputs.version != '' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Without a version the semver tags read the pushed tag. A call runs
          # for master, but only a push of master moves main.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          load: true
          tags: tumblr-like:test
      - name: Smoke test
        run: docker run --rm --network none tumblr-like:test test/smoke.sh
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The builder still holds the layers of the build above, so this only pushes.
      # The labels include org.opencontainers.image.source and .revision, which
      # the scanner reads to find the repository and the commit of an image.
      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Each push of main or latest leaves the image it replaced untagged. The action
  # deletes untagged images only, and treats the platform images and attestations
  # under a tagged index as part of it, so no tagged image loses a child.
  #
  # A call from release.yaml does not run it: a cleanup that failed there would
  # fail the call and leave the version untagged. The next push cleans up.
  cleanup:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The action is not safe to run twice at once against the same package.
    concurrency:
      group: ghcr-cleanup
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          delete-untagged: true
          # Checks after the run that every multi-arch image still has all of
          # its platform images, and warns in the log if one does not.
          validate: true
