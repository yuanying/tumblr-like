name: Image

# Every run builds the image and runs the smoke test in it. Only a tag publishes:
# v0.4.0 is pushed as 0.4.0, 0.4 and latest.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The image runs as a CronJob on the workers of fraction, which are all amd64.
  # The arm64 machines there are control planes and take no workloads.
  PLATFORMS: linux/amd64

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          load: true
          tags: tumblr-like:test
      - name: Smoke test
        run: docker run --rm --network none tumblr-like:test test/smoke.sh
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The builder still holds the layers of the build above, so this only pushes.
      - name: Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
